version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: proctor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examdb}
      POSTGRES_USER: ${POSTGRES_USER:-examuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exampass}
    ports:
      - "5433:5432"   # Host port 5433 -> Container internal 5432
    volumes:
      - exam_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examuser} -d ${POSTGRES_DB:-examdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - proctor_net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: proctor_ai_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: info
    networks:
      - proctor_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proctor_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-examdb}
      DB_USERNAME: ${POSTGRES_USER:-examuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-exampass}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-in-production-min-32-bytes}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,https://*.vercel.app}
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "8080:8080"
    volumes:
      - ./backend/evidence:/app/evidence
    networks:
      - proctor_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: proctor_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/ssl:/etc/nginx/ssl:ro
    networks:
      - proctor_net

volumes:
  exam_pg_data:

networks:
  proctor_net:
    driver: bridge
