version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: examdb
      POSTGRES_USER: examuser
      POSTGRES_PASSWORD: exampass
    ports:
      - "5432:5432"
    volumes:
      - exam_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examuser -d examdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: info

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/examdb
      DB_USERNAME: examuser
      DB_PASSWORD: exampass
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-in-production-min-32-bytes}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8081
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  exam_pg_data:
