server:
  port: 8080

spring:
  application:
    name: exam-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/examdb}
    username: ${DB_USERNAME:examuser}
    password: ${DB_PASSWORD:exampass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-min-32-bytes}
    admin-access-token-minutes: ${JWT_ADMIN_ACCESS_MIN:30}
    admin-refresh-token-days: ${JWT_ADMIN_REFRESH_DAYS:7}
    student-session-token-minutes: ${JWT_STUDENT_SESSION_MIN:240}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    admin-lockout-attempts: 5
    admin-lockout-minutes: 15
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 1500
    read-timeout-ms: 2500

logging:
  level:
    com.proctor.exam: INFO
