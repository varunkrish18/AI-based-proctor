# Gitleaks configuration for AEPS
title = "AEPS Secret Detection"

[extend]
useDefault = true

[allowlist]
description = "Allowed placeholders and sample files"
paths = [
    '''\.env\.example''',
    '''README\.md''',
    '''docs/.*'''
]
regexes = [
    '''aeps-jwt-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256''',
    '''example-key''',
    '''test-secret'''
]
